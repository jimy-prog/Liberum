services:
  liberum-app:
    build:
      context: ..
      dockerfile: cloudflare_deploy/Dockerfile
    container_name: liberum-app
    restart: unless-stopped
    environment:
      APP_NAME: Liberum
      APP_TAGLINE: English Learning Platform
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD}
      SESSION_COOKIE_NAME: liberum_session
      DATABASE_URL: sqlite:////app/data/liberum.db
    volumes:
      - liberum_data:/app/data
      - liberum_uploads:/app/uploads
      - liberum_backups:/app/backups
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: liberum-cloudflared
    restart: unless-stopped
    depends_on:
      - liberum-app
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}

volumes:
  liberum_data:
  liberum_uploads:
  liberum_backups:
