services:
  liberum-app:
    build:
      context: ..
      dockerfile: cloudflare_deploy/Dockerfile
    container_name: liberum-app-direct
    restart: unless-stopped
    environment:
      APP_NAME: Liberum
      APP_TAGLINE: English Learning Platform
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD}
      SESSION_COOKIE_NAME: liberum_session
      DATABASE_URL: sqlite:////app/data/liberum.db
    volumes:
      - liberum_data:/app/data
      - liberum_uploads:/app/uploads
      - liberum_backups:/app/backups
    ports:
      - "8000:8000"

volumes:
  liberum_data:
  liberum_uploads:
  liberum_backups:
