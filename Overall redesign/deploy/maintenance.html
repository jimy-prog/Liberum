<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Updating Liberum...</title>
    <style>
        body {
            background-color: #0F172A; /* Slate 900 */
            color: #F8FAFC; /* Slate 50 */
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }
        p {
            font-size: 1.125rem;
            color: #94A3B8; /* Slate 400 */
            max-width: 500px;
            margin-bottom: 2rem;
            line-height: 1.5;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-left-color: #3B82F6; /* Blue 500 */
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <h1>Updating Liberum</h1>
    <p>We are currently installing a new update to bring you more features and better stability.<br><br><strong>Liberum will be back online in just a few seconds.</strong></p>

    <script>
        // Check if the server is back online every 3 seconds
        setInterval(() => {
            fetch(window.location.href, { method: 'HEAD' })
                .then(response => {
                    if (response.status !== 502 && response.status !== 503) {
                        window.location.reload();
                    }
                })
                .catch(() => {
                    // Still offline, do nothing
                });
        }, 3000);
    </script>
</body>
</html>
