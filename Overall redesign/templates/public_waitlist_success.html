<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Registration Successful | Liberum</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:        #f6f7fb;
            --bg2:       #ffffff;
            --border:    #e5e7eb;
            --text:      #101114;
            --text2:     #6b6f7a;
            --text3:     #9ca3af;
            --accent:    #7b61ff;
            --green:     #16a34a;
            --green-glow: rgba(22, 163, 74, 0.2);
            --radius:    18px;
            --font-d:    'Space Grotesk', sans-serif;
            --font-b:    'Inter', sans-serif;
        }

        body {
            font-family: var(--font-b);
            background-color: var(--bg);
            background-image: radial-gradient(circle, rgba(22, 163, 74, 0.05) 1px, transparent 1px);
            background-size: 24px 24px;
            color: var(--text);
            margin: 0;
            padding: 24px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 440px;
            position: relative;
        }
        
        .glow-circle {
            position: absolute;
            width: 250px;
            height: 250px;
            background: var(--green);
            opacity: 0.15;
            filter: blur(80px);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: var(--radius);
            padding: 48px 32px;
            text-align: center;
            box-shadow: 0 18px 50px rgba(17, 24, 39, 0.04), 0 4px 12px rgba(22, 163, 74, 0.04);
            position: relative;
            z-index: 1;
        }

        .icon-box {
            width: 72px;
            height: 72px;
            background: rgba(22, 163, 74, 0.1);
            color: var(--green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px auto;
            box-shadow: 0 4px 12px var(--green-glow);
            animation: scaleIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .icon-box svg {
            width: 36px;
            height: 36px;
            stroke-width: 2.5;
        }
        
        @keyframes scaleIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .card h1 {
            font-family: var(--font-d);
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 16px 0;
            letter-spacing: -0.02em;
            color: var(--text);
        }

        .card p {
            color: var(--text2);
            margin: 0;
            font-size: 15px;
            line-height: 1.6;
        }
        
        .teacher-name {
            font-weight: 600;
            color: var(--accent);
        }

        .footer-brand {
            text-align: center;
            margin-top: 28px;
            font-size: 13px;
            color: var(--text3);
            font-weight: 500;
            position: relative;
            z-index: 1;
        }
        
        .footer-brand a {
            color: var(--text2);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }
        
        .footer-brand a:hover {
            color: var(--accent);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="glow-circle"></div>
        <div class="card">
            <div class="icon-box">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            <h1>You're on the list!</h1>
            <p>Thank you for registering. We have securely saved your information. <span class="teacher-name">{{ teacher_name }}</span> will review your request and get in touch with you shortly.</p>
        </div>
        
        <div class="footer-brand">
            Powered by <a href="https://liberum.uz" target="_blank">Liberum</a>
        </div>
    </div>
</body>
</html>
