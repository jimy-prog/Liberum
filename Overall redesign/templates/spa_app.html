<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liberum — Platform Redesign (Preview)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<style>
/* ================= TOKENS ================= */
:root{
  --bg:#F5F5F7; --card:#FFFFFF; --card2:#FBFBFD; --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.18);
  --line:rgba(0,0,0,.07); --txt:#1D1D1F; --txt2:#6E6E73; --txt3:#AEAEB2;
  --acc:#7B61FF; --acc2:#6B51EF; --accbg:rgba(123,97,255,.1);
  --green:#30D158; --greenD:#1E9E4A; --red:#FF453A; --yellow:#FFD60A; --orange:#FF9F0A; --money:#1E9E4A;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 28px -12px rgba(0,0,0,.08);
  --r:18px; --rs:13px;
  --fd:'Space Grotesk',sans-serif; --fb:'Inter',-apple-system,sans-serif; --fm:'JetBrains Mono',monospace;
}
[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --card2:#232325; --fill:rgba(120,120,128,.18); --fill2:rgba(120,120,128,.28);
  --line:rgba(255,255,255,.09); --txt:#F5F5F7; --txt2:#98989D; --txt3:#636366;
  --accbg:rgba(123,97,255,.18); --greenD:#30D158; --money:#30D158;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 32px -12px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--fb);background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;transition:background .3s}
.lucide{width:18px;height:18px;stroke-width:2}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:var(--rs);padding:11px 14px;outline:none;width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3.5px var(--accbg)}
::placeholder{color:var(--txt3)}
::-webkit-scrollbar{width:0;height:0}

/* ================= SHELL ================= */
.app{display:flex;min-height:100vh}
.side{width:250px;flex:none;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px 14px;border-right:1px solid var(--line);background:var(--bg);z-index:40}
.brand{font-family:var(--fd);font-weight:700;font-size:23px;letter-spacing:-.03em;padding:0 12px;display:flex;align-items:center;gap:10px}
.brand span{color:var(--acc)}
.brand .dotl{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px}
.rolesw{display:flex;background:var(--fill);border-radius:12px;padding:3px;margin:18px 4px 14px}
.rolesw button{flex:1;font-size:12px;font-weight:600;color:var(--txt2);padding:7px;border-radius:9px;transition:.2s}
.rolesw button.on{background:var(--card);color:var(--txt);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.navlbl{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--txt3);padding:14px 12px 6px}
.ni{display:flex;align-items:center;gap:11px;padding:9.5px 12px;border-radius:12px;font-size:14px;font-weight:500;color:var(--txt2);margin-bottom:2px;transition:.18s;width:100%;text-align:left;position:relative}
.ni:hover{background:var(--fill);color:var(--txt)}
.ni.on{background:var(--card);color:var(--txt);font-weight:600;box-shadow:var(--shadow)}
.ni.on::before{content:'';position:absolute;left:-14px;top:20%;bottom:20%;width:3.5px;border-radius:2px;background:var(--acc)}
.ni .lucide{width:19px;height:19px}
.ni .cnt{margin-left:auto;font-size:10.5px;font-weight:700;background:var(--acc);color:#fff;border-radius:999px;padding:1.5px 7px}
.side .sp{flex:1}
.ucard{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.ucard .nm{font-size:13px;font-weight:600}
.ucard .rl{font-size:11px;color:var(--txt2)}

.main{flex:1;min-width:0}
header.top{position:sticky;top:0;z-index:30;padding:26px 40px 0;background:linear-gradient(var(--bg) 78%,transparent);}
.top .row1{display:flex;align-items:center;justify-content:space-between;gap:16px}
.ltitle{font-family:var(--fd);font-size:34px;font-weight:700;letter-spacing:-.035em}
.lsub{font-size:13.5px;color:var(--txt2);margin-top:3px}
.tacts{display:flex;gap:10px;align-items:center}
.aic{width:40px;height:40px;border-radius:13px;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;color:var(--txt2);position:relative;transition:.15s}
.aic:hover{color:var(--txt);transform:translateY(-1px)}
.aic .bdg{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid var(--card)}
.view{padding:22px 40px 60px;max-width:1180px}

/* ================= COMPONENTS ================= */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.card.tight{padding:6px 8px}
.ct{font-family:var(--fd);font-size:16px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.ct .link{font-family:var(--fb);font-size:12.5px;font-weight:600;color:var(--acc)}
.segs{display:inline-flex;background:var(--fill);border-radius:12px;padding:3px;margin-bottom:20px}
.segs button{font-size:13px;font-weight:600;color:var(--txt2);padding:8px 16px;border-radius:9px;transition:.2s;white-space:nowrap}
.segs button.on{background:var(--card);color:var(--txt);box-shadow:0 1px 5px rgba(0,0,0,.1)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--acc);color:#fff;font-size:13.5px;font-weight:600;padding:11px 20px;border-radius:999px;transition:.18s;box-shadow:0 6px 18px -8px var(--acc)}
.btn:hover{background:var(--acc2);transform:translateY(-1px)}
.btn.ghost{background:var(--card);color:var(--txt);box-shadow:var(--shadow)}
.btn.soft{background:var(--accbg);color:var(--acc2);box-shadow:none}
.btn.dang{background:rgba(255,69,58,.1);color:var(--red);box-shadow:none}
.btn.sm{padding:8px 15px;font-size:12.5px}
.btn.block{width:100%}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:4px 10px;border-radius:999px;text-transform:uppercase}
.p-green{background:rgba(48,209,88,.14);color:var(--greenD)}
.p-red{background:rgba(255,69,58,.12);color:var(--red)}
.p-orange{background:rgba(255,159,10,.14);color:#B26A00}
.p-grey{background:var(--fill);color:var(--txt2)}
.p-acc{background:var(--accbg);color:var(--acc2)}
.row{display:flex;align-items:center;gap:14px;padding:13px 12px;border-radius:14px;transition:.15s;cursor:pointer}
.row:hover{background:var(--fill)}
.row + .row{border-top:1px solid var(--line)}
.av{width:40px;height:40px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:600;font-size:14px;color:#fff}
.rmain{flex:1;min-width:0}
.rt{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{font-size:12px;color:var(--txt2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rend{text-align:right;flex:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:16px}
.stat{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px}
.stat .ic{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.stat .v{font-family:var(--fd);font-size:26px;font-weight:700;letter-spacing:-.02em}
.stat .l{font-size:11.5px;color:var(--txt2);font-weight:500;margin-top:2px}
.stat .d{font-size:11.5px;margin-top:7px;font-weight:600}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.prog{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.prog i{display:block;height:100%;border-radius:3px;background:var(--acc);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{font-size:12.5px;font-weight:600;padding:8px 15px;border-radius:999px;background:var(--card);color:var(--txt2);box-shadow:var(--shadow);transition:.15s}
.chip.on{background:var(--txt);color:var(--bg);box-shadow:none}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:13px;box-shadow:var(--shadow);padding:0 14px;flex:1}
.search input{border:none;box-shadow:none;background:transparent;padding:12px 0}
.search input:focus{box-shadow:none}
.search .lucide{color:var(--txt3);flex:none}
.kv{display:flex;justify-content:space-between;font-size:13.5px;padding:10px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:none}
.kv span{color:var(--txt2)}.kv b{font-weight:600}
.money{color:var(--money);font-weight:700}
.tblhead{display:grid;gap:14px;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--txt3);padding:0 12px 10px}
.trow{display:grid;gap:14px;align-items:center;padding:12px;border-radius:14px;transition:.15s;cursor:pointer}
.trow:hover{background:var(--fill)}
.trow + .trow{border-top:1px solid var(--line)}
.empty{text-align:center;padding:44px 20px;color:var(--txt2)}
.empty .lucide{width:30px;height:30px;color:var(--txt3);margin-bottom:12px}
.empty b{display:block;font-family:var(--fd);font-size:16px;color:var(--txt);margin-bottom:6px}

/* modal */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.32);backdrop-filter:blur(6px);z-index:90;display:none;align-items:center;justify-content:center;padding:20px}
.ovl.open{display:flex;animation:fadein .2s ease}
@keyframes fadein{from{opacity:0}}
.modal{background:var(--card);border-radius:22px;box-shadow:0 24px 80px -20px rgba(0,0,0,.35);width:100%;max-width:460px;max-height:88vh;overflow-y:auto;padding:26px;animation:pop .28s cubic-bezier(.2,.9,.3,1.1)}
@keyframes pop{from{transform:scale(.94) translateY(12px);opacity:0}}
.modal .mt{font-family:var(--fd);font-size:19px;font-weight:600;display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal .x{width:30px;height:30px;border-radius:50%;background:var(--fill);display:flex;align-items:center;justify-content:center;color:var(--txt2)}
.fgroup{margin-bottom:14px}
.fgroup label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--txt2);margin-bottom:7px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* toast */
#toasts{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{display:flex;align-items:center;gap:9px;background:var(--txt);color:var(--bg);font-size:13px;font-weight:500;padding:12px 20px;border-radius:999px;box-shadow:0 12px 32px rgba(0,0,0,.25);animation:tin .3s cubic-bezier(.2,.9,.3,1.2)}
@keyframes tin{from{transform:translateY(16px);opacity:0}}
.toast .lucide{width:15px;height:15px;color:var(--green)}

/* drawer */
.drawer{position:fixed;top:0;right:-480px;width:460px;height:100vh;background:var(--bg);z-index:95;transition:right .35s cubic-bezier(.2,.8,.2,1);box-shadow:-20px 0 60px rgba(0,0,0,.15);overflow-y:auto;padding:26px}
.drawer.open{right:0}

/* week grid */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.daycol{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px 10px;min-height:150px}
.daycol .dn{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--txt3);text-transform:uppercase}
.daycol .dd{font-family:var(--fd);font-size:16px;font-weight:600;margin:3px 0 10px}
.daycol.today .dd{color:var(--acc)}
.evt{border-radius:9px;padding:7px 9px;font-size:10.5px;font-weight:600;margin-bottom:6px;line-height:1.4;cursor:pointer;transition:.15s}
.evt:hover{transform:scale(1.03)}
.evt small{display:block;font-weight:500;opacity:.75;font-size:9.5px}

/* heatmap */
.heat{display:grid;gap:6px;font-size:11px}
.heat .hcell{padding:9px 0;border-radius:9px;text-align:center;font-weight:600;font-size:11.5px}

/* exam overlay */
.exam{position:fixed;inset:0;background:var(--bg);z-index:120;display:none;flex-direction:column}
.exam.open{display:flex}
.exambar{display:flex;align-items:center;justify-content:space-between;padding:16px 34px;border-bottom:1px solid var(--line);background:var(--card)}
.exambody{flex:1;overflow-y:auto;padding:34px;max-width:760px;margin:0 auto;width:100%}
.etimer{font-family:var(--fm);font-weight:600;font-size:14px;background:var(--fill);border-radius:11px;padding:9px 15px;display:inline-flex;gap:8px;align-items:center}
.etimer.warn{background:rgba(255,69,58,.12);color:var(--red)}
.opt{display:flex;align-items:center;gap:12px;background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:15px 17px;margin-bottom:10px;font-size:14px;font-weight:500;cursor:pointer;transition:.15s;border:2px solid transparent}
.opt:hover{transform:translateX(3px)}
.opt.sel{border-color:var(--acc);background:var(--accbg)}
.opt .k{width:26px;height:26px;border-radius:8px;background:var(--fill);font-family:var(--fm);font-size:11.5px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
.opt.sel .k{background:var(--acc);color:#fff}
.wave{display:flex;align-items:center;gap:3px;height:40px}
.wave i{width:4px;border-radius:2px;background:var(--acc)}
.qnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.qnav i{width:32px;height:32px;border-radius:9px;background:var(--card);box-shadow:var(--shadow);font-style:normal;font-family:var(--fm);font-size:11px;display:flex;align-items:center;justify-content:center;color:var(--txt2);cursor:pointer}
.qnav i.done{background:var(--accbg);color:var(--acc2);font-weight:600}
.qnav i.cur{background:var(--acc);color:#fff;font-weight:600}
.editor2{background:var(--card);box-shadow:var(--shadow);border-radius:16px;padding:20px;font-size:14.5px;line-height:1.7;min-height:230px;outline:none}
.recp{width:76px;height:76px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 0 0 12px rgba(255,69,58,.12),0 0 0 26px rgba(255,69,58,.05);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 18px rgba(255,69,58,.14),0 0 0 36px rgba(255,69,58,.06)}}
.spin{width:52px;height:52px;border-radius:50%;border:3.5px solid var(--fill);border-top-color:var(--acc);animation:spn 1s linear infinite;margin:0 auto}
@keyframes spn{to{transform:rotate(360deg)}}
.chat{display:flex;flex-direction:column;gap:10px;padding:6px 0 14px}
.bub{max-width:75%;padding:12px 16px;border-radius:19px;font-size:14px;line-height:1.55}
.bub.ai{background:var(--card);box-shadow:var(--shadow);border-bottom-left-radius:7px;align-self:flex-start}
.bub.me{background:var(--acc);color:#fff;border-bottom-right-radius:7px;align-self:flex-end}
.hbar-wrap{display:flex;align-items:flex-end;gap:18px;height:170px;padding:10px 4px 0}
.hbar2{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.hbar2 i{width:100%;max-width:44px;border-radius:9px 9px 4px 4px;background:linear-gradient(180deg,var(--acc),var(--acc2));transition:height .7s cubic-bezier(.2,.8,.2,1)}
.hbar2 i.dim{background:var(--fill2)}
.hbar2 span{font-size:10.5px;color:var(--txt3);font-weight:600}
.dotsw{display:flex;gap:9px}
.dotsw i{width:26px;height:26px;border-radius:50%;cursor:pointer;transition:.15s}
.dotsw i.on{box-shadow:0 0 0 2.5px var(--card),0 0 0 5.5px var(--acc)}
.tgl{width:46px;height:27px;border-radius:14px;background:var(--fill2);position:relative;cursor:pointer;transition:.25s;flex:none}
.tgl::after{content:'';position:absolute;top:2.5px;left:2.5px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:.25s}
.tgl.on{background:var(--acc)}.tgl.on::after{left:21.5px}
/* exam chrome, chat & misc additions */
.exhead{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 20px;border-bottom:1px solid var(--fill);background:var(--card)}
.exhead .x{width:32px;height:32px;border-radius:50%;background:var(--fill);border:none;display:flex;align-items:center;justify-content:center;color:var(--txt2);cursor:pointer}
.exbody{flex:1;overflow-y:auto;padding:26px 20px 34px}
.excard{max-width:660px;margin:0 auto;background:var(--card);border-radius:22px;padding:26px;box-shadow:var(--shadow)}
.exnav{display:flex;gap:6px;padding:10px 16px;border-top:1px solid var(--fill);background:var(--card)}
.exnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 6px;border:none;background:none;border-radius:12px;font-size:11px;font-weight:500;color:var(--txt3);cursor:pointer;font-family:var(--fb)}
.exnav button.on{color:var(--acc);background:var(--accbg)}
.extime{font-family:var(--fm);font-weight:600;font-size:14px;background:var(--fill);border-radius:99px;padding:7px 15px}
.extime.warn{background:rgba(255,69,58,.12);color:var(--red)}
.opt b{width:26px;height:26px;border-radius:8px;background:var(--fill);font-family:var(--fm);font-size:11.5px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
.opt.sel b{background:var(--acc);color:#fff}
.bub.in{background:var(--card);box-shadow:var(--shadow);border-bottom-left-radius:7px;align-self:flex-start}
.bub.out{background:var(--acc);color:#fff;border-bottom-right-radius:7px;align-self:flex-end}
.chat{flex:1;overflow-y:auto;padding:16px 22px}
.cinput{display:flex;gap:10px;align-items:center;padding:14px 16px;border-top:1px solid var(--fill)}
.cinput input{flex:1;border:none;background:var(--fill);border-radius:99px;padding:12px 18px;font-size:14px;font-family:var(--fb);outline:none;color:var(--txt)}
.ct2{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--txt3);margin:16px 0 8px}
.playbtn{width:46px;height:46px;border-radius:50%;background:var(--acc);color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.tpts{display:inline-flex;gap:5px;align-items:center}
.tpts i{width:7px;height:7px;border-radius:50%;background:var(--txt3);animation:tp 1.1s infinite ease-in-out}
.tpts i:nth-child(2){animation-delay:.15s}.tpts i:nth-child(3){animation-delay:.3s}
@keyframes tp{40%{opacity:.25;transform:translateY(-2px)}}
.wave i{height:10px}
.wave i:nth-child(3n){height:22px}.wave i:nth-child(4n){height:30px}.wave i:nth-child(5n){height:15px}.wave i:nth-child(7n){height:34px}
@media (max-width:1000px){.side{width:74px;padding:16px 8px}.side .brand div:last-child,.side .ni span,.side .navlbl,.side .rolesw,.ucard .uc-t{display:none}.ni{justify-content:center}.view{padding:16px 18px 60px}header.top{padding:18px 18px 0}.grid2,.grid3{grid-template-columns:1fr}.drawer{width:100vw;right:-100vw}.wk{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
  <!-- ============ SIDEBAR ============ -->
  <aside class="side">
    <div class="brand"><div class="dotl">L</div><div>Liber<span>um</span></div></div>
    
    <nav id="nav"></nav>
    <div class="sp"></div>
    <button class="ni" onclick="go('settings')"><i data-lucide="settings"></i><span>Settings</span></button>
    <div class="ucard" style="margin-top:10px">
      <div class="av" id="uAv" style="background:#7B61FF">AR</div>
      <div class="uc-t"><div class="nm" id="uName">Aziza Rahimova</div><div class="rl" id="uRole">Teacher · Rahimova Studio</div></div>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <div class="main">
    <header class="top">
      <div class="row1">

<script>
/* ================= DUMMY DATA ================= */
const AVC=['#7B61FF','#4C6EF5','#1098AD','#2F9E44','#C2255C','#1864AB','#EA580C','#7048E8'];
const DB={{ db_json | safe }};
/* ================= HELPERS ================= */
const $=q=>document.querySelector(q);
const av=(n,sz=40)=>{const i=n.charCodeAt(0)%AVC.length;return `<div class="av" style="width:${sz}px;height:${sz}px;background:${AVC[i]};font-size:${sz*.35}px">${n.split(' ').map(w=>w[0]).slice(0,2).join('')}</div>`};
const esc=s=>s.replace(/'/g,"\\'");
function toast(msg,ic='check-circle-2'){const t=document.createElement('div');t.className='toast';t.innerHTML=`<i data-lucide="${ic}"></i>${msg}`;$('#toasts').appendChild(t);lucide.createIcons();setTimeout(()=>{t.style.opacity=0;t.style.transition='.3s';setTimeout(()=>t.remove(),300)},2400)}
function openModal(html){$('#modal').innerHTML=html;$('#ovl').classList.add('open');lucide.createIcons()}
function closeModal(){$('#ovl').classList.remove('open')}
function openDrawer(html){$('#drawer').innerHTML=html;$('#drawer').classList.add('open');lucide.createIcons()}
function closeDrawer(){$('#drawer').classList.remove('open')}
function toggleTheme(){const h=document.documentElement;const d=h.dataset.theme==='dark';h.dataset.theme=d?'':'dark';$('#themeIc').setAttribute('data-lucide',d?'moon':'sun');lucide.createIcons();toast(d?'Light mode':'Dark mode',d?'sun':'moon')}
function setAccent(c,c2){document.documentElement.style.setProperty('--acc',c);document.documentElement.style.setProperty('--acc2',c2);document.querySelectorAll('.dotsw i').forEach(d=>d.classList.toggle('on',d.dataset.c===c))}
function seg(el,fn){el.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('on'));el.classList.add('on');fn()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeDrawer()}});
/* ================= ROUTER / SHELL ================= */
let role='{{ role }}',curView='home';
const NAVS={
 teacher:[['home','Home','layout-dashboard'],['schedule','Schedule','calendar-days'],['students','Students','users'],['learning','Learning','book-open'],['mock','Mock Tests','target'],['money','Money','wallet']],
 student:[['home','Home','layout-dashboard'],['learn','Learn','book-open'],['mock','Mock Tests','target'],['lexi','Lexi AI','sparkles'],['payments','Payments','credit-card']]
};
const TITLES={
 teacher:{home:['Home','Your studio at a glance'],schedule:['Schedule','Timetable · attendance · online · class invites'],students:['Students','CRM · groups · waitlist · performance · placement'],learning:['Learning','Homework · courses · library · Lexi AI'],mock:['Mock Tests','IELTS & SAT · results · review inbox'],money:['Money','Payments · finance · payroll · reports'],settings:['Settings','Profile · appearance · finance · security · archive']},
 student:{home:['Home','Your learning at a glance'],learn:['Learn','Lessons · homework · courses · library'],mock:['Mock Tests','IELTS & SAT · history · results'],lexi:['Lexi AI','Your personal AI tutor'],payments:['Payments','Balance & history'],settings:['Settings','Profile · notifications · appearance · security']}
};
function renderNav(){$('#nav').innerHTML=`<div class="navlbl">${role==='teacher'?'Studio':'Learning'}</div>`+NAVS[role].map(([id,l,ic])=>`<button class="ni ${curView===id?'on':''}" onclick="go('${id}')"><i data-lucide="${ic}"></i><span>${l}</span>${id==='mock'&&role==='teacher'?'<span class="cnt">3</span>':''}${id==='learn'&&role==='student'?'<span class="cnt">1</span>':''}</button>`).join('');lucide.createIcons()}
function go(v){curView=v;const[t,s]=TITLES[role][v];$('#vTitle').textContent=t;$('#vSub').textContent=s;
 const cta=role==='teacher'?(v==='students'?'Add student':v==='learning'?'Assign homework':v==='money'?'Record payment':v==='schedule'?'Add lesson':'Quick add'):(v==='mock'?'Take a mock':v==='lexi'?'New chat':v==='payments'?'Pay now':'Continue learning');
 $('#ctaTxt').textContent=cta;renderNav();VIEWS[role==='teacher'?'t_'+v:'s_'+v]();window.scrollTo({top:0});location.hash=role+'/'+v}
function setRole(r,quiet){
 role=r;curView='home';
 $('#uName').textContent='{{ user_name }}';
 $('#uRole').textContent='{{ user_role_display }}';
 $('#uAv').textContent='{{ user_initials }}';
}

function quickAdd(){if(role==='student'){if(curView==='mock')startExam();else if(curView==='lexi'){const ci=document.getElementById('chatIn');if(ci)ci.focus();toast('New chat with Lexi','sparkles')}else if(curView==='payments')toast('Checkout (demo)','credit-card');else go('learn');return}
 if(curView==='students')mAddStudent();else if(curView==='learning')mAssignHW();else if(curView==='money')mRecordPay();else mAddLesson()}
</script>

  <div class="card"><div class="ct">Enrollment</div><div style="font-size:13px;color:var(--txt2)">Courses are auto-assigned by level — a B1 student sees only B1 materials. <span class="link" onclick="toast('Auto-assignment rules opened','wand-2')">Edit rules →</span></div></div>`}
 if(lrTab==='library'){B.innerHTML=`<div class="card"><div class="ct">Universal Grammar · A1–C2</div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px">${['A1','A2','B1','B1+','B2','C1','C2'].map(l=>`<div style="background:var(--fill);border-radius:14px;padding:14px;text-align:center;cursor:pointer" onclick="toast('Grammar ${l} opened','book-open')"><div style="font-size:17px;font-weight:700">${l}</div><div style="font-size:10.5px;color:var(--txt3);margin-top:2px">24 units</div></div>`).join('')}</div></div>
  <div class="card"><div class="ct">Audiobooks &amp; podcasts</div>${[['The Alchemist','B2 · 4h 12m'],['Atomic Habits','C1 · 5h 40m'],['6 Minute English','B1 · 142 episodes']].map(([t,s])=>`<div class="row"><div class="av" style="background:rgba(48,209,88,.12);color:var(--greenD)"><i data-lucide="headphones"></i></div><div class="rmain"><div class="rt">${t}</div><div class="rs">${s}</div></div><button class="btn ghost sm" onclick="toast('Added to class playlist','plus')">Assign</button></div>`).join('')}</div>`}
 if(lrTab==='lexi'){B.innerHTML=`<div class="card"><div style="display:flex;gap:14px;align-items:center"><div class="av" style="width:52px;height:52px;font-size:22px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff"><i data-lucide="sparkles"></i></div><div class="rmain"><div class="rt" style="font-size:16px">Lexi · AI English Tutor</div><div class="rs">Your students' 24/7 speaking & writing practice partner</div></div></div></div>
  <div class="stats"><div class="stat"><div class="v">212</div><div class="l">Chats this week</div></div><div class="stat"><div class="v">14</div><div class="l">Active students</div></div><div class="stat"><div class="v">86%</div><div class="l">Satisfaction</div></div></div>
  <div class="card"><div class="ct">Recent Lexi conversations</div>${DB.students.slice(0,3).map((s,i)=>`<div class="row">${av(s.n)}<div class="rmain"><div class="rt">${s.n}</div><div class="rs">"${['Practising job interview answers…','Essay coherence feedback…','IELTS Part 2 cue cards…'][i]}"</div></div><span class="pill p-grey">${['2h','5h','1d'][i]} ago</span></div>`).join('')}</div>`}
 lucide.createIcons()}
function mAssignHW(){openModal(`<div class="mt">Assign homework<button class="x" onclick="closeModal()"><i data-lucide="x"></i></button></div>

 <div class="frow"><div class="fgroup"><label>Group</label><select id="hwG">${DB.groups.map(g=>`<option>${g.n}</option>`).join('')}</select></div><div class="fgroup"><label>Due</label><input id="hwD" type="date" value="2026-08-20"></div></div>
 <div class="fgroup"><label>Instructions</label><textarea rows="3" placeholder="250 words, use at least 5 linking words…"></textarea></div>
 <button class="btn block" onclick="const t=document.getElementById('hwT').value||'New homework';fetch('/api/v1/homework',{method:'POST',body:JSON.stringify({title:t,group:document.getElementById('hwG').value,due:document.getElementById('hwD').value})});DB.homework.unshift({t:t,g:document.getElementById('hwG').value,due:'Due Aug 20',got:0,of:8,st:'ok'});closeModal();toast('Homework assigned','book-open');if(typeof lrTab!=='undefined'){lrTab='homework';lrRender()}">Assign</button>`)}

<script>
/* ---------- MOCK TESTS (teacher: catalog + review inbox + history) ---------- */
let mkTab='inbox';
VIEWS.t_mock=()=>mkRender();
function mkRender(){const tabs=[['inbox','Review inbox'],['catalog','Catalog'],['history','History']];
 $('#view').innerHTML=`<div class="segs">${tabs.map(([id,l])=>`<button class="${mkTab===id?'on':''}" onclick="mkTab='${id}';mkRender()">${l}</button>`).join('')}</div><div id="mkBody"></div>`;
 const B=$('#mkBody');
 if(mkTab==='inbox'){B.innerHTML=`<div class="card"><div class="ct">Waiting for your review <span class="pill p-red">${DB.reviews.length}</span></div>
  ${DB.reviews.map((r,i)=>`<div class="row">${av(r.s)}<div class="rmain"><div class="rt">${r.s} <span class="pill ${r.st==='SLA'?'p-red':'p-grey'}" style="margin-left:6px">${r.st}</span></div><div class="rs">${r.w} · ${r.d}</div></div><button class="btn sm" onclick="mGrade(${i})">Grade</button></div>`).join('')}</div>
  <div class="card"><div style="display:flex;gap:12px;align-items:center"><i data-lucide="sparkles" style="color:var(--acc)"></i><div style="font-size:13px;color:var(--txt2)">Lexi pre-scores every essay — you confirm or adjust. Average grading time: <b style="color:var(--txt)">90 seconds</b>.</div></div></div>`}
 if(mkTab==='catalog'){B.innerHTML=`<div class="card"><div class="ct">Mock tests <button class="btn sm" onclick="toast('Test builder opened','plus')"><i data-lucide="plus"></i>New test</button></div>
  ${DB.mocks.map(m=>`<div class="row"><div class="av" style="background:var(--accbg);color:var(--acc2)"><i data-lucide="${m.type.startsWith('SAT')?'pen-square':'clipboard-list'}"></i></div><div class="rmain"><div class="rt">${m.t} <span class="pill p-grey" style="margin-left:6px">${m.type}</span></div><div class="rs">${m.dur} · ${m.secs}</div></div><button class="btn ghost sm" onclick="toast('Test assigned','send')">Assign</button><button class="btn soft sm" onclick="startExam()">Preview</button></div>`).join('')}</div>`}
 if(mkTab==='history'){B.innerHTML=`<div class="card"><div class="ct">Recent attempts</div>
  ${DB.history.map(h=>`<div class="row"><div class="av" style="background:var(--fill);color:var(--txt2)"><i data-lucide="clipboard-list"></i></div><div class="rmain"><div class="rt">${h.t}</div><div class="rs">${h.d}</div></div><span class="pill ${h.st==='Reviewed'?'p-green':'p-acc'}">${h.b} · ${h.st}</span></div>`).join('')}</div>`}
 lucide.createIcons()}
function mGrade(i){const r=DB.reviews[i];openModal(`<div class="mt">Grade · ${r.s}<button class="x" onclick="closeModal()"><i data-lucide="x"></i></button></div>
 <div style="background:var(--fill);border-radius:14px;padding:14px;font-size:13px;line-height:1.7;margin-bottom:14px">"In my opinion, technology has fundamentally changed the way we learn languages. Firstly, students can now access authentic materials…"</div>
 <div class="card" style="background:var(--accbg);box-shadow:none;margin-bottom:14px"><div style="display:flex;gap:10px;align-items:center"><i data-lucide="sparkles" style="color:var(--acc)"></i><div style="font-size:12.5px;color:var(--acc2)"><b>Lexi suggests 6.5</b> · strong cohesion, limited lexical range</div></div></div>
 <div class="frow">${r.crit.slice(0,2).map(([c,v])=>`<div class="fgroup"><label>${c}</label><input type="number" value="${v}" step="0.5" min="0" max="9"></div>`).join('')}</div>
 <div class="frow">${r.crit.slice(2).map(([c,v])=>`<div class="fgroup"><label>${c}</label><input type="number" value="${v}" step="0.5" min="0" max="9"></div>`).join('')}</div>
 <div class="fgroup"><label>Feedback for student</label><textarea rows="2">Good structure — work on topic-specific vocabulary.</textarea></div>
 <button class="btn block" onclick="DB.reviews.splice(${i},1);closeModal();toast('Graded · band 6.5 sent','check-circle-2');mkRender()">Publish grade</button>`)}
/* ---------- EXAM RUNNER (used by both roles) ---------- */
let exStep=0,exAnswers={},exTimer=null,exSecs=58*60;
const EXQ=[['In recent years, online learning has become increasingly popular. What is the main reason given in the text?',['It is cheaper than classroom study','It allows flexible scheduling','It requires less effort','It is more social'],1],
['The author suggests that traditional classrooms will…',['disappear completely','remain important for young children','be replaced by AI tutors','become more expensive'],1],
['Choose the correct word: "Neither the students ___ the teacher was present."',['or','nor','and','but'],1],
['What does the word "ubiquitous" most nearly mean?',['rare','controversial','present everywhere','expensive'],2],
['According to the passage, the best time to review vocabulary is…',['the night before a test','once a month','shortly after learning it','only in class'],2]];
function startExam(){exStep=0;exAnswers={};exSecs=58*60;$('#exam').style.display='flex';exRender()}
function closeExam(){clearInterval(exTimer);$('#exam').style.display='none';toast('Exam closed','x')}
function exRender(){const E=$('#exam');
 const heads=['Instructions','Part 1 · Listening','Part 2 · Reading','Part 3 · Writing','Part 4 · Speaking','Submitting','Results'];
 const steps=['info','headphones','book-open','pen-line','mic','loader','award'];
 if(exStep===0){E.innerHTML=`<div class="excard"><div style="text-align:center;margin-bottom:8px"><div class="av" style="width:64px;height:64px;font-size:26px;margin:0 auto;background:var(--accbg);color:var(--acc)"><i data-lucide="clipboard-list"></i></div></div>
  <h2 style="text-align:center;font-size:22px;letter-spacing:-.02em;margin:12px 0 4px">IELTS Mock Test #12</h2><p style="text-align:center;color:var(--txt2);font-size:13px;margin-bottom:20px">Full test · about 58 minutes · headphones recommended</p>
  ${[['headphones','Listening','4 recordings · 10 questions'],['book-open','Reading','1 passage · 5 questions'],['pen-line','Writing','Task 2 essay · 250 words'],['mic','Speaking','3 prompts · record answers']].map(([i,t,s])=>`<div class="row" style="padding-left:0;padding-right:0"><div class="av" style="background:var(--fill);color:var(--txt2)"><i data-lucide="${i}"></i></div><div class="rmain"><div class="rt">${t}</div><div class="rs">${s}</div></div></div>`).join('')}
  <button class="btn block" style="margin-top:16px" onclick="exStep=1;exStart();exRender()">Begin test</button>
  <button class="btn ghost block" style="margin-top:8px" onclick="closeExam()">Exit</button></div>`;lucide.createIcons();return}
 E.innerHTML=`<div class="exhead"><button class="x" onclick="closeExam()"><i data-lucide="x"></i></button><div style="font-weight:600;font-size:14px">${heads[exStep]}</div><div class="extime" id="exTime">58:00</div></div>
 <div class="exbody"><div class="excard" id="exCard"></div></div>
 <div class="exnav">${[1,2,3,4].map(i=>`<button class="${exStep===i?'on':''}" onclick="exStep=${i};exRender()"><i data-lucide="${steps[i]}"></i>${['','Listening','Reading','Writing','Speaking'][i]}</button>`).join('')}</div>`;
 const C=$('#exCard');
 if(exStep===1){C.innerHTML=`<div style="display:flex;align-items:center;gap:14px;background:var(--fill);border-radius:16px;padding:16px;margin-bottom:18px"><button class="playbtn" onclick="toast('Playing recording 1…','play')"><i data-lucide="play"></i></button><div class="rmain"><div class="rt">Recording 1 · Section 1</div><div class="wave">${'<i></i>'.repeat(24)}</div></div><span style="font-family:var(--fm);font-size:12px;color:var(--txt3)">02:40</span></div>
  ${EXQ.slice(0,2).map((q,i)=>exQHTML(i,q)).join('')}
  <button class="btn block" onclick="exStep=2;exRender()">Continue to Reading →</button>`}
 if(exStep===2){C.innerHTML=`<div style="background:var(--fill);border-radius:16px;padding:16px;font-size:13px;line-height:1.75;margin-bottom:18px;max-height:130px;overflow:auto">In recent years, online learning has become increasingly popular, largely because it allows flexible scheduling for working adults. Yet the author argues that traditional classrooms remain important, particularly for young children who need social structure. Vocabulary, once ubiquitous in paper flashcards, is now best reviewed shortly after learning it, using spaced-repetition apps…</div>
  ${EXQ.slice(2).map((q,i)=>exQHTML(i+2,q)).join('')}
  <button class="btn block" onclick="exStep=3;exRender()">Continue to Writing →</button>`}
 if(exStep===3){C.innerHTML=`<div style="background:var(--accbg);border-radius:16px;padding:16px;margin-bottom:16px"><div style="font-weight:600;font-size:14px;color:var(--acc2)">Writing Task 2</div><div style="font-size:13.5px;line-height:1.6;margin-top:6px;color:var(--txt)">Some people believe that technology has made learning languages easier than ever. To what extent do you agree or disagree? <span style="color:var(--txt2)">Write at least 250 words.</span></div></div>
  <textarea id="essay" class="editor2" placeholder="Start writing here…" oninput="document.getElementById('wc').textContent=(this.value.trim().match(/\\S+/g)||[]).length">${exAnswers.essay||''}</textarea>
  <div style="display:flex;justify-content:space-between;align-items:center;margin:10px 0 16px"><span style="font-size:12.5px;color:var(--txt2)"><b id="wc">0</b> words · min 250</span><span class="pill p-acc"><i data-lucide="sparkles" style="width:12px;height:12px"></i>Lexi checks as you type</span></div>
  <button class="btn block" onclick="exAnswers.essay=document.getElementById('essay').value;exStep=4;exRender()">Continue to Speaking →</button>`}
 if(exStep===4){C.innerHTML=`<div style="text-align:center;padding:12px 0 20px"><div class="recp"><i data-lucide="mic"></i></div><div style="font-weight:600;font-size:15px;margin-top:14px">Part 2 · Cue card</div><p style="font-size:13.5px;color:var(--txt2);line-height:1.6;max-width:340px;margin:8px auto">Describe a skill you learned recently. Say what it is, why you learned it, and how it helped you. <b style="color:var(--txt)">Speak for 1–2 minutes.</b></p>
  <button class="btn" id="recBtn" onclick="this.innerHTML='<i data-lucide=&quot;square&quot;></i>Recording… 0:23';lucide.createIcons();toast('Recording started','mic')"><i data-lucide="circle"></i>Tap to record</button></div>
  <button class="btn block" onclick="exStep=5;exRender();exSubmit()">Finish & submit</button>`}
 if(exStep===5){E.innerHTML=`<div class="excard" style="text-align:center;padding:60px 24px"><div style="display:flex;justify-content:center"><span class="tpts"><i></i><i></i><i></i></span></div><h2 style="font-size:19px;margin:22px 0 6px">Lexi is grading your test…</h2><p style="font-size:13px;color:var(--txt2)">Checking 5 answers, scoring your essay on 4 criteria,<br>and analysing your speaking fluency.</p></div>`}
 if(exStep===6){E.innerHTML=`<div class="excard"><div style="text-align:center;margin-bottom:20px"><div style="font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--txt3);font-weight:600">Overall band</div><div style="font-size:64px;font-weight:700;letter-spacing:-.04em;color:var(--acc2);line-height:1.1">6.5</div><span class="pill p-green" style="margin-top:6px">Ready for real IELTS</span></div>
  ${[['Listening','7.0','8/10 correct'],['Reading','6.5','3/5 correct'],['Writing','6.5','Strong cohesion · expand vocabulary'],['Speaking','6.0','Good fluency · watch fillers']].map(([t,b,s])=>`<div class="row" style="padding-left:0;padding-right:0"><div class="rmain"><div class="rt">${t}</div><div class="rs">${s}</div></div><span style="font-size:20px;font-weight:700;color:var(--acc2)">${b}</span></div>`).join('')}
  <div class="card" style="background:var(--accbg);box-shadow:none;margin-top:8px"><div style="display:flex;gap:10px"><i data-lucide="sparkles" style="color:var(--acc);flex:none"></i><div style="font-size:12.5px;color:var(--acc2);line-height:1.55"><b>Lexi's plan:</b> focus on topic vocabulary (Unit B2-7) and Part 3 follow-up questions. Suggested retake in 3 weeks.</div></div></div>
