name: Production Deploy

on:
  workflow_dispatch:
  push:
    branches: [ feature/white-labeling-updates, main, master ]

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Sync deployment to database
        if: always()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          B64_MSG=$(echo -n "$COMMIT_MSG" | base64 | tr -d '\n')
          
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p 22 "ubuntu@130.61.234.227" "bash -s" "$RUN_NUMBER" "$SHA" "$B64_MSG" "$JOB_STATUS" << 'EOF'
          set -eu
          RUN_NUMBER="$1"
          SHA="$2"
          B64_MSG="$3"
          JOB_STATUS="$4"
          
          if [ "$JOB_STATUS" = "success" ]; then
              STATUS="Live"
          else
              STATUS="Failed"
          fi
          
          echo "Waiting for background cron deployment to restart container if needed..."
          sleep 10
          
          echo "Syncing deployment to Platform Updates..."
          CONTAINER=$(sudo docker ps -qf "name=liberum-app" | head -n 1)
          if [ -n "$CONTAINER" ]; then
              sudo docker exec $CONTAINER python -c "
import sys
import base64
try:
    from master_database import SessionMaster, PlatformUpdate
    b64_msg = sys.argv[1]
    b64_msg += '=' * ((4 - len(b64_msg) % 4) % 4)
    msg = base64.b64decode(b64_msg).decode('utf-8', errors='replace')
    status_str = sys.argv[3]
    db = SessionMaster()
    # Check if this deploy is already logged to prevent duplicates if restarted
    existing = db.query(PlatformUpdate).filter_by(version='Deploy #' + sys.argv[2]).first()
    if existing:
        existing.status = status_str
        existing.description = msg
    else:
        db.add(PlatformUpdate(version='Deploy #' + sys.argv[2], title='GitHub Deployment', description=msg, status=status_str))
    db.commit()
    db.close()
    print('Sync successful')
except Exception as e:
    print('Error syncing platform update:', str(e))
" "$B64_MSG" "$RUN_NUMBER" "$STATUS" || true
          else
              echo "Could not find liberum-app container"
          fi
          
          echo "Action finished with status: $JOB_STATUS"
          EOF
