name: Production Deploy

on:
  workflow_dispatch:
  push:
    branches: [ feature/white-labeling-updates, main, master ]

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Sync project to production server
        run: |
          rsync -az --delete \
            -e "ssh -p 22 -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude ".git" \
            --exclude "__pycache__" \
            --exclude "*.pyc" \
            --exclude ".DS_Store" \
            --exclude "teacher_admin.db" \
            --exclude "liberum.db" \
            --exclude "backups" \
            --exclude "uploads" \
            ./ "ubuntu@130.61.234.227:/home/ubuntu/Liberum/"

      - name: Write production env and deploy
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p 22 "ubuntu@130.61.234.227" << EOF
          set -eu
          mkdir -p "/home/ubuntu/Liberum/cloudflare_deploy"
          cat > "/home/ubuntu/Liberum/cloudflare_deploy/.env" << EOT
          SESSION_SECRET_KEY=${{ secrets.SESSION_SECRET_KEY }}
          DEFAULT_ADMIN_PASSWORD=${{ secrets.DEFAULT_ADMIN_PASSWORD }}
          CLOUDFLARE_TUNNEL_TOKEN=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          SMTP_HOST="mail.liberum.uz"
          SMTP_PORT="465"
          SMTP_USER="main@liberum.uz"
          SMTP_PASSWORD="8AX-qsz-UCV-NQd"
          EOT
          cd "${{ secrets.SERVER_PATH }}/cloudflare_deploy"
          docker compose up -d --build
          EOF
