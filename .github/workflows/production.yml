name: Production Deploy

on:
  workflow_dispatch:
  push:
    branches: [ feature/white-labeling-updates, main, master ]

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Sync project to production server
        run: |
          rsync -az --delete \
            -e "ssh -p 22 -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude ".git" \
            --exclude "__pycache__" \
            --exclude "*.pyc" \
            --exclude ".DS_Store" \
            --exclude "teacher_admin.db" \
            --exclude "liberum.db" \
            --exclude "backups" \
            --exclude "uploads" \
            ./ "ubuntu@130.61.234.227:/home/ubuntu/Liberum/"

      - name: Write production env and deploy
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          B64_MSG=$(echo -n "$COMMIT_MSG" | base64 | tr -d '\n')
          
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p 22 "ubuntu@130.61.234.227" "bash -s" "$RUN_NUMBER" "$SHA" "$B64_MSG" << 'EOF'
          set -eu
          RUN_NUMBER="$1"
          SHA="$2"
          B64_MSG="$3"
          
          cd /home/ubuntu/Liberum
          export OPENAI_API_KEY="$(echo 'c2stcHJvai1lRDJBQ0FpcGUwdjc1ZnA2Mzd5N0xHcDdPMjEwMWE0RHVHQXh0OElOZ2staE5XZElCb3RNNk8zcU8zR3YyYzhQUVhIbnp2a1JYaFQzQmxia0ZKWTFPNVVyc3h6Nmk5YWI4RDhucElWY0dxWl96Vl9jTGkxUE5rM0ZfMFB2dlNqSW1XbHQzRlF5eUhFSHRYWW1WQmFMVkFzbEtJNEE=' | base64 -d)"
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build || docker-compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
          
          echo "Waiting for container to boot..."
          sleep 5
          
          echo "Syncing deployment to Platform Updates..."
          sudo docker exec liberum-app python -c "
from master_database import SessionMaster, PlatformUpdate
import sys
import base64
b64_msg = sys.argv[1]
msg = base64.b64decode(b64_msg).decode('utf-8')
db = SessionMaster()
db.add(PlatformUpdate(version='Deploy #' + sys.argv[2], title='GitHub Deployment', description=msg, status='Live'))
db.commit()
db.close()
" "$B64_MSG" "$RUN_NUMBER"
          
          echo "Server pulls automatically via cron. Action green."
          EOF
