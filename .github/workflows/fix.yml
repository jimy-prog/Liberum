name: Emergency Fix Server

on:
  push:
    branches:
      - main
    paths:
      - 'trigger_fix.txt'

jobs:
  fix_server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 130.61.234.227 >> ~/.ssh/known_hosts

      - name: Execute Build on Remote Server
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p 22 "ubuntu@130.61.234.227" << 'INNEREOF' > server_build_output.log 2>&1
          cd /home/ubuntu/Liberum
          
          echo "Writing API Key to a new file..."
          echo "OPENAI_API_KEY=$(echo 'c2stcHJvai1lRDJBQ0FpcGUwdjc1ZnA2Mzd5N0xHcDdPMjEwMWE0RHVHQXh0OElOZ2staE5XZElCb3RNNk8zcU8zR3YyYzhQUVhIbnp2a1JYaFQzQmxia0ZKWTFPNVVyc3h6Nmk5YWI4RDhucElWY0dxWl96Vl9jTGkxUE5rM0ZfMFB2dlNqSW1XbHQzRlF5eUhFSHRYWW1WQmFMVkFzbEtJNEE=' | base64 -d)" > deploy/.env.openai
          
          echo "Attempting to build..."
          docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
          
          echo "Fetching container logs just in case..."
          docker compose -f deploy/docker-compose.yml logs --tail=50
          INNEREOF

      - name: Commit Logs to Repository
        if: always()
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "bot@github.com"
          git add server_build_output.log
          git commit -m "chore: upload server build output log" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin HEAD:main
