name: Debug Server

on:
  push:
    branches:
      - main
    paths:
      - 'trigger_debug.txt'

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Fetch Server Logs
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p 22 "ubuntu@130.61.234.227" << 'INNEREOF' > server_logs.txt 2>&1
          echo "==== RESET OWNER ===="
          sudo docker exec liberum-app python -c "
import sqlite3
from master_database import SessionMaster, User
from auth import set_password

db = SessionMaster()
owner = db.query(User).filter_by(role='owner').first()
if owner:
    print(f'Owner found: {owner.username} / {owner.email}')
    set_password('admin123', owner)
    print('Password reset to admin123')
else:
    print('No owner found!')
db.close()
"
          INNEREOF
          
      - name: Commit Logs to Repository
        if: always()
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "bot@github.com"
          git add server_logs.txt
          git commit -m "chore: upload server logs" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin HEAD:main

