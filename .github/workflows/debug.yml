name: Debug Server

on:
  push:
    branches:
      - main
    paths:
      - 'trigger_debug.txt'

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Fetch Server Logs
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 130.61.234.227 >> ~/.ssh/known_hosts
          
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p 22 "ubuntu@130.61.234.227" << 'INNEREOF'
          # Fix auto_deploy.sh on server
          cat << 'SH_EOF' > /home/ubuntu/auto_deploy.sh
#!/bin/bash
cd /home/ubuntu/liberum
git fetch origin main
LOCAL=\$(git rev-parse HEAD)
REMOTE=\$(git rev-parse origin/main)

if [ \$LOCAL != \$REMOTE ]; then
    echo "\$(date) - Changes detected. Pulling..." >> /home/ubuntu/auto_deploy.log
    git pull origin main
    echo "\$(date) - Rebuilding docker containers..." >> /home/ubuntu/auto_deploy.log
    cd /home/ubuntu/liberum-data
    docker-compose down
    docker-compose --profile tunnel up -d --build
    echo "\$(date) - Deployment complete." >> /home/ubuntu/auto_deploy.log
fi
SH_EOF
          chmod +x /home/ubuntu/auto_deploy.sh
          
          # Manually start the tunnel RIGHT NOW
          cd /home/ubuntu/liberum-data
          docker-compose --profile tunnel up -d
          INNEREOF
          sudo docker ps -a

