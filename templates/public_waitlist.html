<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join {{ teacher_name }}'s Waitlist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FAFAFA;
            --text-color: #1A1A1A;
            --muted-text: #666666;
            --border-color: #E5E5E5;
            --primary-color: #2F80ED;
            --primary-hover: #1F6AD5;
            --card-bg: #FFFFFF;
            --error-color: #E02424;
            --input-bg: #F9FAFB;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 24px;
            box-sizing: border-box;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 8px 0;
            letter-spacing: -0.02em;
        }

        .header p {
            color: var(--muted-text);
            margin: 0;
            font-size: 15px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-color);
        }

        input[type="text"], input[type="tel"], select, textarea {
            width: 100%;
            padding: 12px 16px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--input-bg);
            box-sizing: border-box;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(47, 128, 237, 0.1);
            background-color: #FFFFFF;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .required::after {
            content: " *";
            color: var(--error-color);
        }

        .btn-submit {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: var(--text-color);
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            margin-top: 12px;
        }

        .btn-submit:hover {
            background-color: #333333;
        }
        
        .btn-submit:active {
            transform: scale(0.98);
        }

        .footer-brand {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: var(--muted-text);
        }
        
        .footer-brand a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }
        
        @media (max-width: 480px) {
            .card {
                padding: 24px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>Join the Waitlist</h1>
                <p>Register your interest for classes with <b>{{ teacher_name }}</b>.</p>
            </div>
            
            <form action="/join/{{ username }}/submit" method="POST">
                <div class="form-group">
                    <label class="required" for="name">Student's Full Name</label>
                    <input type="text" id="name" name="name" required placeholder="John Doe">
                </div>
                
                <div class="form-group">
                    <label class="required" for="phone">Student's Phone Number</label>
                    <input type="tel" id="phone" name="phone" required placeholder="+998 90 123 45 67">
                </div>
                
                <div class="form-group">
                    <label for="parent_phone">Parent's Phone Number (Optional)</label>
                    <input type="tel" id="parent_phone" name="parent_phone" placeholder="+998 90 987 65 43">
                </div>
                
                <div class="form-group">
                    <label for="level">Current English Level</label>
                    <select id="level" name="level">
                        <option value="">I'm not sure</option>
                        <option value="Beginner">Beginner</option>
                        <option value="Elementary">Elementary</option>
                        <option value="Pre-Intermediate">Pre-Intermediate</option>
                        <option value="Intermediate">Intermediate</option>
                        <option value="Upper-Intermediate">Upper-Intermediate</option>
                        <option value="Advanced">Advanced</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="mode">Preferred Format</label>
                    <select id="mode" name="mode">
                        <option value="in-person">In-Person Classes</option>
                        <option value="online">Online Classes</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="learning_goal">What are your learning goals?</label>
                    <textarea id="learning_goal" name="learning_goal" placeholder="E.g., IELTS preparation, speaking practice, grammar..."></textarea>
                </div>
                
                <button type="submit" class="btn-submit">Submit Registration</button>
            </form>
        </div>
        
        <div class="footer-brand">
            Powered by <a href="https://liberum.uz" target="_blank">Liberum</a>
        </div>
    </div>
</body>
</html>
