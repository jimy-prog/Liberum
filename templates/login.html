<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Login — Liberum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Inter',sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background-color:#f6f7fb;
  background-image:radial-gradient(circle, rgba(123, 97, 255, 0.07) 1px, transparent 1px);
  background-size:24px 24px;
  -webkit-font-smoothing:antialiased;
}
.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:20px;
  padding:44px 40px;
  width:100%;
  max-width:400px;
  box-shadow:0 18px 50px rgba(17, 24, 39, 0.1);
}
.logo{
  font-family:'Space Grotesk',sans-serif;
  font-size:2rem;
  font-weight:600;
  color:#101114;
  text-align:center;
  margin-bottom:6px;
  letter-spacing:-0.03em;
}
.logo span{color:#7b61ff}
.sub{
  text-align:center;
  font-size:.72rem;
  color:#6b6f7a;
  letter-spacing:.12em;
  text-transform:uppercase;
  margin-bottom:28px;
  font-weight:500;
}
.form-label{
  display:block;
  font-size:.68rem;
  font-weight:600;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:#6b6f7a;
  margin-bottom:8px;
}
.form-control{
  width:100%;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:13px 16px;
  font-family:'Inter',sans-serif;
  font-size:1rem;
  color:#101114;
  outline:none;
  transition:border-color .15s, box-shadow .15s;
  -webkit-appearance:none;
}
.form-control:focus{
  border-color:#7b61ff;
  box-shadow:0 0 0 3px rgba(123, 97, 255, 0.2);
}
.form-group{margin-bottom:20px}
.btn{
  width:100%;
  background:#7b61ff;
  color:#fff;
  border:none;
  border-radius:999px;
  padding:14px;
  font-family:'Inter',sans-serif;
  font-size:.95rem;
  font-weight:600;
  cursor:pointer;
  transition:background .15s, transform .1s;
  margin-top:8px;
}
.btn:hover{background:#6b51ef}
.btn:active{transform:scale(.99)}
.error{
  background:rgba(220, 38, 38, 0.08);
  border:1px solid rgba(220, 38, 38, 0.25);
  color:#b91c1c;
  padding:12px 14px;
  border-radius:12px;
  font-size:.82rem;
  margin-bottom:18px;
  text-align:center;
  display: none;
}
.hint{
  text-align:center;
  font-size:.75rem;
  color:#6b6f7a;
  margin-top:20px;
  line-height:1.5;
}
.back{
  display:block;
  text-align:center;
  margin-top:18px;
  font-size:.8rem;
  color:#7b61ff;
  text-decoration:none;
  font-weight:500;
}
.back:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Liber<span>um</span></div>
  <div class="sub">English Learning Platform</div>
  
  <div class="error" id="error-msg"></div>

  <!-- Email Password Form -->
  <form id="login-form">
    <div class="form-group">
      <label class="form-label">Email</label>
      <input class="form-control" type="text" id="email" required placeholder="Enter your email or username">
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input class="form-control" type="password" id="password" required placeholder="Enter your password">
    </div>
    <button class="btn" type="submit" id="submit-btn">Sign In</button>
  </form>
  
  <div class="hint" style="margin-top: 20px;">
    Don't have an account? <a href="/register" style="color:#7b61ff; text-decoration:none; font-weight:600;">Sign up</a>
  </div>
  
  <div style="display: flex; align-items: center; text-align: center; color: #94a3b8; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; margin: 20px 0;">
    <span style="flex: 1; border-bottom: 1px solid #e5e7eb; margin-right: 16px;"></span>
    Or
    <span style="flex: 1; border-bottom: 1px solid #e5e7eb; margin-left: 16px;"></span>
  </div>
  
  <button id="google-btn" class="btn" type="button" style="background:#fff; color:#334155; border:1px solid #e5e7eb; margin-top:0; display:flex; align-items:center; justify-content:center; gap:8px;">
    <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" style="width:20px;height:20px;">
    Sign in with Google
  </button>

  <a class="back" href="/static/landing/index.html">← Back to website</a>
</div>

<!-- Firebase SDKs -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyClVBI_xBtZDtoSDv6gWFEv9eCa4WPUDjw",
    authDomain: "liberum-f13ff.firebaseapp.com",
    projectId: "liberum-f13ff",
    storageBucket: "liberum-f13ff.firebasestorage.app",
    messagingSenderId: "730903093236",
    appId: "1:730903093236:web:5f181959e3661c9d16e3a1",
    measurementId: "G-KECV7R1DTE"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const googleProvider = new GoogleAuthProvider();

  const errorEl = document.getElementById("error-msg");
  
  function showError(msg) {
    errorEl.innerText = msg;
    errorEl.style.display = "block";
  }

  async function sendTokenToServer(idToken) {
    const res = await fetch("/api/auth/firebase", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ idToken: idToken, role: "student" }) // Role is ignored if new user, sent just in case
    });
    const data = await res.json();
    if (res.ok) {
        if (data.requires_onboarding) {
            sessionStorage.setItem("pending_firebase_token", idToken);
            sessionStorage.setItem("pending_email", data.email);
            sessionStorage.setItem("pending_name", data.name);
            window.location.href = "/onboarding";
        } else {
            // Redirect to dashboard (or mock tests depending on role)
            window.location.href = data.user.role === 'student' ? '/mock' : '/dashboard';
        }
    } else {
        showError(data.detail || "Authentication failed on server.");
    }
  }

  // Handle Email/Password Login
  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.style.display = "none";
    const btn = document.getElementById("submit-btn");
    btn.innerText = "Signing in...";
    
    try {
      const emailOrUsername = document.getElementById("email").value;
      const pass = document.getElementById("password").value;
      
      // If it looks like an email, try Firebase first
      if (emailOrUsername.includes("@")) {
          try {
              const userCredential = await signInWithEmailAndPassword(auth, emailOrUsername, pass);
              const token = await userCredential.user.getIdToken();
              await sendTokenToServer(token);
              return;
          } catch (err) {
              // Only fallback if the error is not about wrong password
              // But let's just log it and fallback anyway to classic login
              console.warn("Firebase login failed:", err);
          }
      }
      
      // Fallback to classic login (for usernames or if Firebase fails)
      const res = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ identifier: emailOrUsername, password: pass })
      });
      const data = await res.json();
      if (res.ok) {
          window.location.href = data.redirect || "/dashboard";
      } else {
          showError(data.detail || "Authentication failed.");
          btn.innerText = "Sign In";
      }
      
    } catch (err) {
      showError(err.message);
      btn.innerText = "Sign In";
    }
  });

  // Handle Google Login
  document.getElementById("google-btn").addEventListener("click", async () => {
    errorEl.style.display = "none";
    try {
      const result = await signInWithPopup(auth, googleProvider);
      const token = await result.user.getIdToken();
      await sendTokenToServer(token);
    } catch (err) {
      showError(err.message);
    }
  });
</script>
</body>
</html>
