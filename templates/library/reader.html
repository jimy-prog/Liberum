<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reader - {{ book.title }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>

    <style>
        :root {
            --bg-color: #fcfcfc;
            --text-color: #111111;
            --toolbar-bg: #ffffff;
            --toolbar-border: #e5e7eb;
            --btn-bg: #f3f4f6;
            --btn-hover: #e5e7eb;
        }

        body.dark-mode {
            --bg-color: #1a1a1a;
            --text-color: #e5e5e5;
            --toolbar-bg: #2d2d2d;
            --toolbar-border: #404040;
            --btn-bg: #404040;
            --btn-hover: #525252;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Toolbar */
        .toolbar {
            height: 60px;
            background-color: var(--toolbar-bg);
            border-bottom: 1px solid var(--toolbar-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            flex-shrink: 0;
            z-index: 10;
        }

        .toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 12px; }
        
        .book-title { font-weight: 600; font-size: 1.1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 300px; }

        .btn {
            background: var(--btn-bg);
            color: var(--text-color);
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .btn:hover { background: var(--btn-hover); }
        .btn svg { width: 18px; height: 18px; }
        
        .btn-primary { background: #7b61ff; color: white; }
        .btn-primary:hover { background: #6b51ef; }

        /* Reader Container */
        .reader-container {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        #viewer {
            width: 100%;
            max-width: 900px;
            height: 100%;
            position: relative;
            background: var(--bg-color);
        }

        /* Navigation Arrows */
        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 80px;
            background: rgba(0,0,0,0.05);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
            opacity: 0.5;
            transition: opacity 0.2s, background 0.2s;
            z-index: 5;
        }
        .nav-arrow:hover { opacity: 1; background: rgba(0,0,0,0.1); }
        body.dark-mode .nav-arrow { background: rgba(255,255,255,0.05); }
        body.dark-mode .nav-arrow:hover { background: rgba(255,255,255,0.1); }
        
        #prev { left: 0; border-radius: 0 8px 8px 0; }
        #next { right: 0; border-radius: 8px 0 0 8px; }

        /* PDF iframe */
        #pdf-viewer { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <!-- Toolbar -->
    <div class="toolbar">
        <div class="toolbar-left">
            <a href="/library/books" class="btn">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            </a>
            <div class="book-title">{{ book.title }}</div>
        </div>
        
        <div class="toolbar-right">
            <!-- Controls (Only for EPUB) -->
            {% if book.file_url.endswith('.epub') %}
            <button id="btn-font-dec" class="btn">A-</button>
            <button id="btn-font-inc" class="btn">A+</button>
            {% endif %}
            
            <!-- Dark Mode Toggle -->
            <button id="btn-theme" class="btn">🌙</button>
        </div>
    </div>

    <!-- Reader Area -->
    <div class="reader-container">
        {% if book.file_url.endswith('.epub') %}
            <button id="prev" class="nav-arrow">
                <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <div id="viewer"></div>
            <button id="next" class="nav-arrow">
                <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </button>
        {% else %}
            <iframe id="pdf-viewer" src="{{ book.file_url }}"></iframe>
        {% endif %}
    </div>

    <script>
        // --- Theme Management ---
        const themeBtn = document.getElementById('btn-theme');
        let isDark = localStorage.getItem('reader-theme') === 'dark';
        
        function applyTheme() {
            if (isDark) {
                document.body.classList.add('dark-mode');
                themeBtn.textContent = '☀️';
            } else {
                document.body.classList.remove('dark-mode');
                themeBtn.textContent = '🌙';
            }
        }
        applyTheme();

        themeBtn.addEventListener('click', () => {
            isDark = !isDark;
            localStorage.setItem('reader-theme', isDark ? 'dark' : 'light');
            applyTheme();
            if(rendition) applyEpubTheme(); // Update epub iframe if it exists
        });

        // --- EPUB.js Logic ---
        const fileUrl = "{{ book.file_url }}";
        let rendition = null;
        let currentFontSize = 100; // Percentage

        if (fileUrl.endsWith('.epub')) {
            const book = ePub(fileUrl);
            rendition = book.renderTo("viewer", {
                width: "100%",
                height: "100%",
                spread: "none"
            });
            
            rendition.display();

            // Navigation
            document.getElementById('prev').addEventListener('click', () => rendition.prev());
            document.getElementById('next').addEventListener('click', () => rendition.next());

            // Keyboard navigation
            document.addEventListener('keyup', (e) => {
                if (e.key === 'ArrowLeft') rendition.prev();
                if (e.key === 'ArrowRight') rendition.next();
            });

            // Font Sizing
            document.getElementById('btn-font-inc').addEventListener('click', () => {
                currentFontSize += 10;
                rendition.themes.fontSize(`${currentFontSize}%`);
            });
            document.getElementById('btn-font-dec').addEventListener('click', () => {
                currentFontSize = Math.max(50, currentFontSize - 10);
                rendition.themes.fontSize(`${currentFontSize}%`);
            });

            // EPUB Theming Injection
            function applyEpubTheme() {
                if(!rendition) return;
                rendition.themes.register("light", {
                    "body": { "background": "#fcfcfc", "color": "#111111" }
                });
                rendition.themes.register("dark", {
                    "body": { "background": "#1a1a1a", "color": "#e5e5e5" }
                });
                rendition.themes.select(isDark ? "dark" : "light");
            }

            rendition.hooks.content.register(() => {
                applyEpubTheme();
                rendition.themes.font("Merriweather, serif");
            });
        }
    </script>
</body>
</html>
