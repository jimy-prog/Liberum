<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Complete Setup — Liberum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"Inter",sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background-color:#f6f7fb;
  background-image:radial-gradient(circle, rgba(123, 97, 255, 0.07) 1px, transparent 1px);
  background-size:24px 24px;
  -webkit-font-smoothing:antialiased;
}
.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:20px;
  padding:44px 40px;
  width:100%;
  max-width:400px;
  box-shadow:0 18px 50px rgba(17, 24, 39, 0.1);
}
.logo{
  font-family:"Space Grotesk",sans-serif;
  font-size:2rem;
  font-weight:600;
  color:#101114;
  text-align:center;
  margin-bottom:6px;
  letter-spacing:-0.03em;
}
.logo span{color:#7b61ff}
.sub{
  text-align:center;
  font-size:.72rem;
  color:#6b6f7a;
  letter-spacing:.12em;
  text-transform:uppercase;
  margin-bottom:28px;
  font-weight:500;
}
.form-label{
  display:block;
  font-size:.68rem;
  font-weight:600;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:#6b6f7a;
  margin-bottom:8px;
}
.form-control{
  width:100%;
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:13px 16px;
  font-family:"Inter",sans-serif;
  font-size:1rem;
  color:#101114;
  outline:none;
  transition:border-color .15s, box-shadow .15s;
  -webkit-appearance:none;
}
.form-control:focus{
  border-color:#7b61ff;
  box-shadow:0 0 0 3px rgba(123, 97, 255, 0.2);
}
.form-group{margin-bottom:20px}
.btn{
  width:100%;
  background:#7b61ff;
  color:#fff;
  border:none;
  border-radius:999px;
  padding:14px;
  font-family:"Inter",sans-serif;
  font-size:.95rem;
  font-weight:600;
  cursor:pointer;
  transition:background .15s, transform .1s;
  margin-top:8px;
}
.btn:hover{background:#6b51ef}
.btn:active{transform:scale(.99)}
.error{
  background:rgba(220, 38, 38, 0.08);
  border:1px solid rgba(220, 38, 38, 0.25);
  color:#b91c1c;
  padding:12px 14px;
  border-radius:12px;
  font-size:.82rem;
  margin-bottom:18px;
  text-align:center;
  display: none;
}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Liber<span>um</span></div>
  <div class="sub">Complete Setup</div>
  
  <div class="error" id="error-msg"></div>

  <form id="onboarding-form">
    <div class="form-group">
      <label class="form-label">Email</label>
      <input class="form-control" type="text" id="email" disabled>
    </div>
    <div class="form-group">
      <label class="form-label">Full Name</label>
      <input class="form-control" type="text" id="full_name" required placeholder="John Doe">
    </div>
    <div class="form-group">
      <label class="form-label">Phone Number</label>
      <input class="form-control" type="tel" id="phone" required placeholder="+998 90 123 45 67">
    </div>
    <div class="form-group">
      <label class="form-label">I am a...</label>
      <select class="form-control" id="role" required>
        <option value="student">Student</option>
        <option value="teacher">Teacher</option>
      </select>
    </div>
    <button class="btn" type="submit" id="submit-btn">Complete Setup</button>
  </form>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const token = sessionStorage.getItem("pending_firebase_token");
    if (!token) {
        window.location.href = "/register";
        return;
    }
    
    document.getElementById("email").value = sessionStorage.getItem("pending_email") || "";
    document.getElementById("full_name").value = sessionStorage.getItem("pending_name") || "";
});

const errorEl = document.getElementById("error-msg");
function showError(msg) {
    errorEl.innerText = msg;
    errorEl.style.display = "block";
}

document.getElementById("onboarding-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.style.display = "none";
    const btn = document.getElementById("submit-btn");
    btn.innerText = "Creating account...";
    
    try {
        const idToken = sessionStorage.getItem("pending_firebase_token");
        const full_name = document.getElementById("full_name").value;
        const phone = document.getElementById("phone").value;
        const role = document.getElementById("role").value;
        
        const res = await fetch("/api/auth/onboarding", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                idToken: idToken,
                full_name: full_name,
                phone: phone,
                role: role
            })
        });
        
        const data = await res.json();
        if (res.ok) {
            sessionStorage.removeItem("pending_firebase_token");
            sessionStorage.removeItem("pending_email");
            sessionStorage.removeItem("pending_name");
            window.location.href = data.user.role === "student" ? "/mock" : "/dashboard";
        } else {
            showError(data.detail || "Setup failed.");
            btn.innerText = "Complete Setup";
        }
    } catch (err) {
        showError(err.message);
        btn.innerText = "Complete Setup";
    }
});
</script>
</body>
</html>
